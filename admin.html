<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>暖暖生日 - 管理员审核</title>
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <div id="loginView" class="login-view">
    <div class="login-card">
      <div class="login-star">✦</div>
      <h1>管理员登录</h1>
      <form id="loginForm">
        <input id="email" type="email" placeholder="邮箱" autocomplete="username" required />
        <input id="password" type="password" placeholder="密码" autocomplete="current-password" required />
        <div id="loginError" class="error hidden"></div>
        <button type="submit">登录</button>
      </form>
      <a class="back-link" href="index.html">← 返回星海</a>
    </div>
  </div>

  <div id="panelView" class="panel-view hidden">
    <header class="panel-header">
      <div>
        <h1>管理后台</h1>
        <div id="stats" class="stats"></div>
      </div>
      <div class="header-actions">
        <a class="btn-ghost" href="index.html" target="_blank">查看星海</a>
        <a class="btn-ghost" href="video.html" target="_blank">查看视频墙</a>
        <button id="logout" class="btn-ghost">退出登录</button>
      </div>
    </header>

    <div class="section-tabs">
      <button id="tabBless" class="section-tab active">祝福审核</button>
      <button id="tabVideo" class="section-tab">视频管理</button>
      <button id="tabNotice" class="section-tab">通知设置</button>
      <button id="tabCompress" class="section-tab">图片压缩</button>
    </div>

    <div id="blessSection" class="section">
      <div class="tabs">
        <button data-filter="pending" class="active">待审核</button>
        <button data-filter="passed">已通过</button>
        <button data-filter="rejected">已驳回</button>
        <button data-filter="all">全部</button>
      </div>
      <div id="list" class="list"></div>
    </div>

    <div id="videoSection" class="section hidden">
      <form id="videoForm" class="video-form">
        <h2 class="form-title">新增视频</h2>
        <div class="form-row">
          <input id="vAuthor" class="field-input" placeholder="投稿人（必填）" required />
          <input id="vTitle" class="field-input" placeholder="标题" />
        </div>
        <input id="vEmbed" class="field-input" placeholder="B站 iframe 嵌入链接（必填）" required />
        <div class="form-row">
          <input id="vCover" class="field-input" placeholder="封面图链接（选填）" />
          <input id="vSort" class="field-input" type="number" placeholder="排序，越小越靠前" />
        </div>
        <input id="vCoverFile" class="field-input" type="file" accept="image/*" />
        <p class="form-hint">封面可上传图片（会自动压缩），或填上面的链接，二选一即可</p>
        <div id="videoFormError" class="error hidden"></div>
        <button type="submit" id="videoSubmit" class="btn-primary">添加视频</button>
      </form>
      <div id="videoList" class="list"></div>
    </div>

    <div id="noticeSection" class="section hidden">
      <div class="video-form">
        <h2 class="form-title">星海通知弹窗</h2>
        <label class="field-label" for="noticeContentInput">通知内容</label>
        <textarea id="noticeContentInput" class="field-input notice-textarea" rows="3"></textarea>
        <label class="checkbox-label">
          <input id="noticeEnabled" type="checkbox" /> 启用通知弹窗（打开星海时显示）
        </label>
        <button type="button" id="noticeSave" class="btn-primary">保存通知</button>
      </div>
      <div class="video-form">
        <h2 class="form-title">关于我们</h2>
        <label class="field-label" for="aboutInput">关于我们内容</label>
        <textarea id="aboutInput" class="field-input notice-textarea" rows="5"></textarea>
        <button type="button" id="aboutSave" class="btn-primary">保存关于我们</button>
      </div>
      <div class="video-form">
        <h2 class="form-title">暖暖星球弹窗</h2>
        <label class="field-label" for="nikkiContentInput">弹窗文字</label>
        <textarea id="nikkiContentInput" class="field-input notice-textarea" rows="3"></textarea>
        <label class="field-label" for="nikkiImageFile">弹窗图片（选填，会自动压缩）</label>
        <input id="nikkiImageFile" class="field-input" type="file" accept="image/*,.heic,.heif,.avif,.png,.jpg,.jpeg,.webp,.gif" />
        <button type="button" id="nikkiSave" class="btn-primary">保存暖暖弹窗</button>
      </div>
      <div class="video-form">
        <h2 class="form-title">生日邀请函</h2>
        <label class="field-label" for="inviteContentInput">邀请函文字</label>
        <textarea id="inviteContentInput" class="field-input notice-textarea" rows="3"></textarea>
        <label class="field-label" for="inviteImageFile">邀请函图片（选填，会自动压缩）</label>
        <input id="inviteImageFile" class="field-input" type="file" accept="image/*,.heic,.heif,.avif,.png,.jpg,.jpeg,.webp,.gif" />
        <button type="button" id="inviteSave" class="btn-primary">保存邀请函</button>
      </div>
      <div class="video-form">
        <h2 class="form-title">通知群图片</h2>
        <label class="field-label" for="groupQrFile">二维码图片（会自动压缩）</label>
        <input id="groupQrFile" class="field-input" type="file" accept="image/*,.png,.jpg,.jpeg,.webp,.gif" />
        <button type="button" id="groupQrSave" class="btn-primary">保存通知群图片</button>
      </div>
    </div>

    <div id="compressSection" class="section hidden">
      <div class="video-form">
        <h2 class="form-title">迁移文件到 Cloudinary</h2>
        <p class="form-hint">把 Supabase 存储里的旧图片 / 语音 / 封面迁移到 Cloudinary（图片会自动压缩），并更新数据库链接。迁移后 Supabase 不再产生这些文件的带宽。</p>
        <div id="compressStatus" class="compress-status">尚未开始</div>
        <button type="button" id="compressStart" class="btn-primary">开始迁移</button>
      </div>
    </div>
  </div>

  <script src="vendor/supabase.min.js"></script>
  <script src="vendor/BenzAMRRecorder.min.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
