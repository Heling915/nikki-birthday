<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>暖暖生日星海祝福</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="starfield"></div>
  <div id="nebula"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">✦</span>
      <span class="brand-name">暖暖生日祝福星海</span>
    </div>
    <nav class="nav">
      <a href="#" class="nav-link active">星海祝福</a>
      <a href="#" class="nav-link disabled">视频墙</a>
      <a href="#" class="nav-link disabled">投稿</a>
      <a href="admin.html" class="nav-link admin-nav">管理</a>
    </nav>
    <div class="countdown">
      <span class="countdown-label">距离生日</span>
      <span id="countdown" class="countdown-value">--天--时--分--秒</span>
    </div>
    <div class="auth">
      <span id="userEmail" class="user-email hidden"></span>
      <button id="authBtn" class="auth-btn">登录 / 注册</button>
    </div>
  </header>

  <div id="hint" class="hint">拖拽旋转 · 滚轮缩放 · 点击星星查看祝福</div>

  <button id="openSubmit" class="submit-fab">✦ 写下祝福</button>
  <button id="openMyBlessings" class="my-fab">我的祝福</button>

  <div id="blessModal" class="modal hidden">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <button class="modal-close" data-close>&times;</button>
      <div class="star-icon">✦</div>
      <div id="blessNickname" class="bless-nickname"></div>
      <div id="blessContent" class="bless-content"></div>
      <div id="blessMedia" class="bless-media"></div>
      <div id="blessTime" class="bless-time"></div>
    </div>
  </div>

  <div id="submitModal" class="modal hidden">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <button class="modal-close" data-close>&times;</button>
      <h2 class="modal-title">写下你的祝福</h2>
      <form id="blessForm">
        <label class="field-label" for="nickname">搭配师</label>
        <input id="nickname" class="field-input" type="text" maxlength="20" placeholder="你的昵称" required />
        <div class="field-count"><span id="nicknameCount">0</span>/20</div>

        <label class="field-label" for="content">祝福语</label>
        <textarea id="content" class="field-input textarea" maxlength="200" rows="5" placeholder="写下对暖暖的生日祝福…" required></textarea>
        <div class="field-count"><span id="contentCount">0</span>/200</div>

        <div class="upload-group">
          <span class="field-label">附件（选填）</span>
          <label class="upload-item">
            <span class="upload-label">照片</span>
            <input id="photoInput" type="file" accept="image/*" />
            <span id="photoName" class="upload-name">未选择</span>
          </label>
          <label class="upload-item">
            <span class="upload-label">语音</span>
            <input id="audioInput" type="file" accept="audio/*" />
            <span id="audioName" class="upload-name">未选择</span>
          </label>
        </div>

        <div id="formError" class="form-error hidden"></div>
        <button type="submit" id="submitBtn" class="btn-primary">提交祝福</button>
        <p class="form-tip">提交后将由管理员审核，通过后你的祝福会化作星海里的一颗星星。</p>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <div id="myBlessingsModal" class="modal hidden">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <button class="modal-close" data-close>&times;</button>
      <h2 class="modal-title">我的祝福</h2>
      <div id="myBlessingsList" class="my-list"></div>
    </div>
  </div>

  <div id="authModal" class="modal hidden">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <button class="modal-close" data-close>&times;</button>
      <h2 class="modal-title" id="authTitle">登录</h2>
      <form id="authForm">
        <label class="field-label" for="authEmail">邮箱</label>
        <input id="authEmail" class="field-input" type="email" autocomplete="email" required />
        <label class="field-label" for="authPassword">密码</label>
        <input id="authPassword" class="field-input" type="password" autocomplete="current-password" minlength="6" required />
        <div id="authError" class="form-error hidden"></div>
        <button type="submit" id="authSubmit" class="btn-primary">登录</button>
      </form>
      <button id="authToggle" class="auth-toggle">没有账号？注册</button>
    </div>
  </div>

  <div id="loading" class="loading">
    <div class="loading-star">✦</div>
    <div class="loading-text">正在点亮星海…</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
    }
  }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
