<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>视频祝福墙 · 暖暖生日</title>
  <link rel="stylesheet" href="css/video.css" />
</head>
<body>
  <div class="bg"></div>

  <header class="topbar">
    <a href="index.html" class="back">← 返回星海</a>
    <div class="title-wrap">
      <h1 class="title">视频祝福墙</h1>
      <p class="subtitle">来自搭配师们的生日祝福</p>
    </div>
    <button id="toggleList" class="toggle-list">收起列表</button>
  </header>

  <main id="container" class="container">
    <aside id="sidebar" class="sidebar">
      <div id="videoList" class="video-list"></div>
    </aside>

    <section class="player-area">
      <div class="video-frame-wrap">
        <iframe
          id="videoFrame"
          src=""
          frameborder="0"
          scrolling="no"
          allowfullscreen
          allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        ></iframe>
      </div>
      <div class="player-info">
        <div id="playerTitle" class="player-title"></div>
        <div id="playerAuthor" class="player-author"></div>
      </div>
    </section>
  </main>

  <div id="loading" class="loading">
    <span class="loading-star">✦</span>
    <span>正在加载视频…</span>
  </div>
  <div id="empty" class="empty hidden">暂无视频展示，敬请期待</div>

  <script src="vendor/supabase.min.js"></script>
  <script type="module" src="js/video.js"></script>
</body>
</html>
